[project]
name = "medical-imaging-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ayush-Singh2309", email = "103182175+Ayush-Singh2309@users.noreply.github.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "opencv-python==4.10.0.84",
    "tensorflow==2.17.0",
    "keras==3.5.0",
    "tensorflow-metal>=1.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "protobuf==3.20.3",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "scikit-learn>=1.9.1",
    "pillow>=13.0.0",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.34",
    "requests>=2.34.2",
    "pydicom>=3.0.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
medical-imaging-ai = "medical_imaging_ai:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "httpx2>=2.16.2",
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/medical_imaging_ai"]
